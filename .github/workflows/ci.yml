name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Check formatting
        if: runner.os == 'Linux'
        run: nix fmt -- --ci
      - name: Check evaluation on all systems
        run: |
          nix eval .#packages.x86_64-linux.default.name
          nix eval .#packages.aarch64-linux.default.name
          nix eval .#packages.aarch64-darwin.default.name
      - name: Smoke run
        run: nix run . -- --version

  docs:
    # Regenerate docs/options.md and push the result. Runs only on push
    # (fork PRs cannot push here); the commit carries [skip ci] so the bot
    # push does not retrigger this workflow.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build docs
        run: nix build .#docs --out-link docs-build --print-build-logs
      - name: Commit docs update
        run: |
          cp docs-build/options.md docs/options.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/options.md
          if git commit -m "docs: regenerate options reference [skip ci]"; then
            git push
          else
            echo "docs/options.md is already up to date"
          fi
