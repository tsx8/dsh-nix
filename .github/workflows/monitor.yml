# Upstream change monitor for dsh-nix.
#
# Two targets, three daily runs at 00:00, 06:00, 12:00 UTC (08:00, 14:00,
# 20:00 UTC+8), manual dispatch supported:
#
# 1. npm-version: compares the pinned version in
#    packages/deepseek-harness/package.nix against the npm `latest` dist-tag
#    of @deepseek-ai/dsh. The `next` dist-tag is reported as context, not a
#    trigger (tracking pre-releases is a policy choice).
#
# 2. nixpkgs-adoption: detects whether the nixos-unstable branch this flake
#    follows ships a `deepseek-harness` package. The check is a
#    Nix evaluation of the attribute (no path/name guessing, no raw-file
#    probes, no master-vs-pinned confusion): `nix eval` of
#    legacyPackages.x86_64-linux.deepseek-harness.name succeeds exactly when
#    `pkgs.deepseek-harness` resolves, i.e. when `nix flake update` would make
#    the package usable.
#
# Every finding opens (or reuses) a `upstream`-labelled issue.

name: Monitor upstream

on:
  schedule:
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-version:
    name: npm dist-tags vs pinned version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure upstream label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create upstream --force --repo "$GITHUB_REPOSITORY"
      - name: Check for newer npm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pinned="$(sed -n 's/^  version = "\(.*\)";$/\1/p' packages/deepseek-harness/package.nix)"
          [ -n "$pinned" ] || { echo "could not parse version from packages/deepseek-harness/package.nix" >&2; exit 1; }

          latest="$(curl -fsS https://registry.npmjs.org/@deepseek-ai/dsh/latest | jq -r .version)"
          next="$(curl -fsS https://registry.npmjs.org/-/package/@deepseek-ai/dsh/dist-tags | jq -r '.next // "n/a"')"

          {
            echo "pinned in package.nix: $pinned"
            echo "npm latest: $latest"
            echo "npm next: $next"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$latest" = "$pinned" ]; then
            echo "pinned version is current (npm latest $latest)"
            exit 0
          fi

          title="upstream: @deepseek-ai/dsh ${latest} released (pinned: ${pinned})"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream --state open --json title --jq '.[].title' | grep -Fx "$title" || true)"
          if [ -n "$existing" ]; then
            echo "issue already open: $title"
            exit 0
          fi

          body="$(cat <<EOF
          New npm release of \`@deepseek-ai/dsh\`:

          - pinned in \`packages/deepseek-harness/package.nix\`: \`${pinned}\`
          - npm \`latest\`: \`${latest}\`
          - npm \`next\`: \`${next}\`

          Update steps:
          1. Bump \`version\` and the \`src\` \`fetchurl\` hash in \`packages/deepseek-harness/package.nix\`.
          2. Run a build; the fixed-output \`npmDepsHash\` mismatch prints \`got: sha256-...\` - copy it back.
          3. Run \`nix flake check\` (HMR boot, PTY, host peer resolution are covered by \`home-manager-runtime\`).
          EOF
          )"
          gh issue create --repo "$GITHUB_REPOSITORY" --label upstream --title "$title" --body "$body"

  nixpkgs-adoption:
    name: nixpkgs adoption of deepseek-harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Ensure upstream label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create upstream --force --repo "$GITHUB_REPOSITORY"
      - name: Check nixpkgs adoption
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Authoritative check: evaluate the attribute on the unpinned
          # nixos-unstable branch we follow (that is the rev `nix flake
          # update` would move to). Any other eval failure is a workflow
          # problem and must surface, not be read as "not adopted".
          adopted=""
          for name in deepseek-harness dsh; do
            if out="$(nix eval --raw "github:NixOS/nixpkgs/nixos-unstable#legacyPackages.x86_64-linux.${name}.name" 2>eval.err)"; then
              adopted="$name"
              break
            fi
            if ! grep -q "does not provide attribute" eval.err; then
              echo "unexpected nix eval failure for ${name}:" >&2
              cat eval.err >&2
              exit 1
            fi
          done

          if [ -z "$adopted" ]; then
            echo "nixos-unstable does not ship deepseek-harness (or dsh) yet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version="$(nix eval --raw "github:NixOS/nixpkgs/nixos-unstable#legacyPackages.x86_64-linux.${adopted}.version")"
          rev="$(nix flake metadata 'github:NixOS/nixpkgs/nixos-unstable' --json | jq -r '.locked.rev')"
          echo "nixos-unstable ships ${adopted}@${version} (rev ${rev})" >> "$GITHUB_STEP_SUMMARY"

          title="upstream: nixpkgs ships deepseek-harness (${adopted}@${version})"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream --state open --json title --jq '.[].title' | grep -Fx "$title" || true)"
          body="$(cat <<EOF
          \`nixos-unstable\` now ships \`${adopted}\` (version \`${version}\`), nixpkgs rev \`${rev}\`.

          Before switching away from the local \`packages/deepseek-harness/package.nix\`:
          1. \`passthru.nodejs\` / \`passthru.pnpm\` contract: \`modules/home-manager.nix\` asserts both when profiles are declared, and \`lib/profile-runtime.nix\` builds the dependency graph with them. The upstream package may need a passthru addition.
          2. Platforms: the nixpkgs package may cover fewer systems than the local one (x86_64-linux, aarch64-linux, aarch64-darwin).
          3. Run \`nix flake check\` (\`home-manager-runtime\` covers HMR boot, PTY, host peer resolution).
          EOF
          )"
          if [ -n "$existing" ]; then
            echo "issue already open: $title"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label upstream --title "$title" --body "$body"
          fi
